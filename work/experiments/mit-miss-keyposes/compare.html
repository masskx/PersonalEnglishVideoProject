<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIT / MISS · 关键姿态试验</title>
<style>body{margin:0;background:#fff;color:#041fa0;font-family:"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:32px}h1{font-size:30px}p{line-height:1.8;color:#505b79}video{width:100%;background:#fff;border:1px solid #ddd;border-radius:12px}button,a{font:inherit}button{cursor:pointer;background:white;color:#041fa0;border:1px solid #bdc5de;padding:10px 16px;margin:5px;border-radius:8px}button[aria-pressed=true]{background:#041fa0;color:white}.chapters button{font-size:14px}.note{font-size:14px}a{color:#041fa0}</style>
<main><h1>MIT / MISS · 关键姿态试验</h1><p>看清准备、变化和结果。可在相同时间点切换原版与测试版。</p>
<div><button id="trial" aria-pressed="true">关键姿态测试</button><button id="original" aria-pressed="false">原版</button></div>
<video id="player" controls preload="metadata" src="mit-miss-keyposes.mp4"></video>
<div class="chapters" id="chapters"></div>
<p class="note">两版使用同一配音和时长。测试版移除了旧机械音效。此页用于形式比较，测试版尚未经过完整人工听审。</p>
<p><a href="pose-contact-sheet.jpg">查看全部姿态</a> · <a href="cover.png">竖版封面</a> · <a href="cover-landscape.png">横版封面</a></p></main>
<script>
const player=document.querySelector('#player');let desiredTime=0,resume=false;
function version(id,src){desiredTime=player.currentTime;resume=!player.paused;player.src=src;document.querySelectorAll('[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',String(b.id===id)));player.load()}
player.addEventListener('loadedmetadata',()=>{player.currentTime=Math.min(desiredTime,player.duration);if(resume)player.play().catch(()=>{})});
document.querySelector('#trial').onclick=()=>version('trial','mit-miss-keyposes.mp4');
document.querySelector('#original').onclick=()=>version('original','../../../outputs/mit-miss/mit-miss.mp4');
for(const [label,time] of [['开场',0],['submit',20.2],['transmit',29.6],['emit',39],['admit',48.4],['permit',57.8],['commit',67.2],['dismiss',76.6],['mission',86],['总结',104.9]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{desiredTime=time;player.currentTime=time};document.querySelector('#chapters').append(b)}
</script></html>
